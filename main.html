<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список дел</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Список дел</h1>
        
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Новая задача">
            <button id="addBtn">Добавить</button>
        </div>
        
        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="active">Активные</button>
            <button class="filter-btn" data-filter="completed">Выполненные</button>
        </div>
        
        <ul class="task-list" id="taskList"></ul>
        
        <div class="empty-state" id="emptyState">
            <p>Пусто</p>
        </div>
        
        <div class="stats">
            <span id="totalTasks">Всего: 0</span>
            <span id="completedTasks">Выполнено: 0</span>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
